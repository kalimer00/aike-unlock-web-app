<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Äike T V33.3 - Compact Status</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: #e0e0e0; font-family: ui-sans-serif, system-ui, sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; overflow: hidden; }
        .lamp { width: 14px; height: 14px; border-radius: 50%; background: #27272a; transition: 0.3s; box-shadow: inset 0 0 4px rgba(0,0,0,0.5); }
        .state-active { background: #22c55e; box-shadow: 0 0 12px #22c55e; }
        .state-locked { background: #ef4444; box-shadow: 0 0 12px #ef4444; }
        .state-warn { background: #facc15; animation: pulse 0.5s infinite; box-shadow: 0 0 12px #facc15; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }
        .btn { padding: 12px; border-radius: 14px; font-weight: bold; text-transform: uppercase; font-size: 0.7rem; border: none; width: 100%; transition: 0.1s; }
        .btn:active { transform: scale(0.95); }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .log-box { font-family: 'Courier New', Courier, monospace; font-size: 9px; line-height: 1.2; height: 80px; overflow-y: auto; background: rgba(0,0,0,0.6); padding: 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); color: #4ade80; }
        #alarmOverlay { background-color: rgba(185, 28, 28, 0.95); }
    </style>
</head>
<body class="p-4">
    <div id="alarmOverlay" class="hidden fixed inset-0 z-[100] flex flex-col items-center justify-center text-center p-6 text-white backdrop-blur-md">
        <h2 class="text-4xl font-black mb-4 uppercase">Signal verloren!</h2>
        <button onclick="location.reload()" class="bg-white text-red-800 px-12 py-4 rounded-full font-black shadow-2xl">NEU VERBINDEN</button>
    </div>

    <div class="w-full max-w-[340px] bg-zinc-900 p-5 rounded-[2.5rem] border border-zinc-800 shadow-2xl relative">
        <div id="timerWarn" class="hidden absolute -top-4 left-6 right-6 bg-yellow-500 text-black p-3 rounded-xl shadow-2xl flex justify-between items-center z-10">
            <span class="text-[10px] font-black uppercase">Auto-Lock in 60s!</span>
            <button onclick="resetInactivityTimer()" class="bg-black text-white px-3 py-1 rounded-lg text-[9px] font-bold">STAY ALIVE</button>
        </div>

        <div class="flex justify-between items-center mb-4">
            <h1 class="font-black text-lg italic text-zinc-100">ÄIKE <span class="text-red-600">T</span></h1>
            <div id="timerDisplay" class="text-[10px] font-mono text-zinc-500 font-bold bg-white/5 px-2 py-1 rounded">05:00</div>
        </div>
        
        <div id="statusBox" class="flex items-center justify-between gap-3 mb-4 glass px-4 py-2.5 rounded-xl min-h-[50px] transition-colors duration-500">
            <div id="status" class="text-[9px] uppercase tracking-widest font-black text-zinc-400">Offline</div>
            <div class="flex items-center gap-3">
                <div id="rxInd" class="text-[7px] text-zinc-700 font-bold transition-colors">DATA RX ◯</div>
                <div id="lamp" class="lamp"></div>
            </div>
        </div>

        <div class="mb-4">
            <div class="flex justify-between items-center mb-1.5 px-1">
                <span class="text-[8px] text-zinc-500 uppercase font-bold">Stream Log (155e)</span>
                <span id="packetCount" class="text-[8px] text-zinc-700 font-mono">0 PKTS</span>
            </div>
            <div id="log" class="log-box">Warten auf Stream...</div>
        </div>

        <div class="flex flex-col gap-2">
            <button id="btnConnect" class="btn bg-white text-black py-4 mb-1 shadow-lg text-sm">Dashboard Koppeln</button>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="execute(0x01)" class="btn bg-green-500/10 text-green-500 border border-green-500/10">Start</button>
                <button onclick="execute(0x02)" class="btn bg-red-500/10 text-red-500 border border-red-500/10">Stop</button>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="execute(0x03)" class="btn bg-zinc-800 text-blue-400 py-2">Eco</button>
                <button onclick="execute(0x05)" class="btn bg-zinc-800 text-orange-600 py-2">Sport</button>
            </div>
            <div class="p-1.5 border border-red-900/10 rounded-lg bg-red-950/5 mt-1 text-center">
                <button onclick="confirmEject()" class="btn bg-red-700 text-white py-2 text-[9px] shadow-lg">Batterie Entriegeln</button>
            </div>
            <div class="grid grid-cols-3 gap-2 mt-1">
                <button onclick="execute(0x06)" class="btn bg-zinc-900 text-zinc-600 text-[8px] py-1">Cmd 06</button>
                <button onclick="execute(0x07)" class="btn bg-zinc-900 text-zinc-600 text-[8px] py-1">Cmd 07</button>
                <button onclick="execute(0x08)" class="btn bg-zinc-900 text-zinc-600 text-[8px] py-1">Cmd 08</button>
            </div>
            <button onclick="safeExit()" class="btn mt-2 bg-transparent text-zinc-700 text-[8px] py-1">Verbindung trennen</button>
        </div>
    </div>

    <script>
        let cmdChar = null, bleDevice = null, watchdog = null, autoLockInterval = null;
        let intentional = false, timeLeft = 300, packets = 0;

        function logData(hex) {
            packets++;
            document.getElementById('packetCount').innerText = packets + " PKTS";
            const logEl = document.getElementById('log');
            const rx = document.getElementById('rxInd');
            
            rx.classList.remove('text-zinc-700');
            rx.classList.add('text-green-500');
            setTimeout(() => {
                rx.classList.remove('text-green-500');
                rx.classList.add('text-zinc-700');
            }, 150);

            let lines = logEl.innerHTML.split('<br>');
            if(lines[0] === "Warten auf Stream...") lines = [];
            lines.unshift(`<span class="text-zinc-500">${new Date().toLocaleTimeString().split(' ')[0]}</span> ${hex}`);
            if (lines.length > 6) lines.pop();
            logEl.innerHTML = lines.join('<br>');
        }

        function resetInactivityTimer() {
            timeLeft = 300;
            document.getElementById('timerWarn').classList.add('hidden');
            document.getElementById('statusBox').classList.remove('bg-yellow-500/10');
            updateTimerUI();
        }

        function updateTimerUI() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            document.getElementById('timerDisplay').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }

        async function execute(cmdId) {
            resetInactivityTimer();
            if(!cmdChar) return;
            try {
                await cmdChar.writeValueWithResponse(new Uint8Array([0x00, 0xD4, 0x00, cmdId, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]));
                document.getElementById('lamp').className = 'lamp ' + (cmdId === 0x02 ? 'state-locked' : 'state-active');
                if(cmdId === 0x01) document.getElementById('status').innerText = "System Aktiv";
                if(cmdId === 0x02) document.getElementById('status').innerText = "Gesperrt";
            } catch(e) { handleSignalLoss(); }
        }

        async function confirmEject() {
            if(confirm("Batteriefach mechanisch entriegeln? Nur im Stillstand ausführen!")) {
                await execute(0x04);
            }
        }

        function handleSignalLoss() {
            if (intentional) return;
            document.getElementById('alarmOverlay').classList.remove('hidden');
            if ("vibrate" in navigator) navigator.vibrate([500, 200, 500]);
        }

        async function safeExit() {
            intentional = true; 
            clearInterval(watchdog); clearInterval(autoLockInterval);
            if(cmdChar) await execute(0x02);
            if(bleDevice) await bleDevice.gatt.disconnect();
            location.reload();
        }

        document.getElementById('btnConnect').onclick = async () => {
            try {
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'Aike' }, { namePrefix: 'AIKE' }],
                    optionalServices: ["00002554-1212-efde-1523-785feabcd123", "00001554-1212-efde-1523-785feabcd123"]
                });
                
                bleDevice.addEventListener('gattserverdisconnected', handleSignalLoss);
                const server = await bleDevice.gatt.connect();
                
                const authSvc = await server.getPrimaryService("00002554-1212-efde-1523-785feabcd123");
                const chal = new Uint8Array((await (await authSvc.getCharacteristic("00002556-1212-efde-1523-785feabcd123")).readValue()).buffer);
                const hash = new Uint8Array(await crypto.subtle.digest('SHA-1', new Uint8Array([...chal, ...new Uint8Array(20).fill(0xFF)])));
                await (await authSvc.getCharacteristic("00002557-1212-efde-1523-785feabcd123")).writeValueWithResponse(hash);
                
                const cmdSvc = await server.getPrimaryService("00001554-1212-efde-1523-785feabcd123");
                cmdChar = await cmdSvc.getCharacteristic("0000155f-1212-efde-1523-785feabcd123");

                try {
                    const dataChar = await cmdSvc.getCharacteristic("0000155e-1212-efde-1523-785feabcd123");
                    await dataChar.startNotifications();
                    dataChar.addEventListener('characteristicvaluechanged', (e) => {
                        let hex = Array.from(new Uint8Array(e.target.value.buffer)).map(b => b.toString(16).padStart(2, '0')).join(' ');
                        logData(hex);
                    });
                } catch(err) { document.getElementById('log').innerText = "Stream blockiert."; }

                document.getElementById('status').innerText = "Online & Sniffing";
                document.getElementById('btnConnect').style.display = 'none';
                document.getElementById('lamp').className = 'lamp state-active';

                autoLockInterval = setInterval(() => {
                    if(timeLeft > 0) {
                        timeLeft--; updateTimerUI();
                        if(timeLeft === 60) {
                            if ("vibrate" in navigator) navigator.vibrate([200, 100, 200]);
                            document.getElementById('timerWarn').classList.remove('hidden');
                            document.getElementById('statusBox').classList.add('bg-yellow-500/10');
                            document.getElementById('lamp').className = 'lamp state-warn';
                        }
                    } else { execute(0x02); clearInterval(autoLockInterval); }
                }, 1000);

                watchdog = setInterval(async () => {
                    if(cmdChar && !intentional) {
                        try { await cmdChar.readValue(); } catch(e) { handleSignalLoss(); }
                    }
                }, 20000);

            } catch (e) { document.getElementById('status').innerText = "Fehler!"; }
        };
    </script>
</body>
</html>
