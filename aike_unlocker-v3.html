<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Äike T Dashboard V25</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: #e0e0e0; font-family: ui-sans-serif, system-ui, sans-serif; }
        .led { width: 16px; height: 16px; border-radius: 50%; background: #1a1a1a; transition: 0.4s; box-shadow: inset 0 0 5px #000; }
        .led-green.active { background: #22c55e; box-shadow: 0 0 15px #22c55e; }
        .led-red.active { background: #ef4444; box-shadow: 0 0 15px #ef4444; }
        .led-blue.active { background: #3b82f6; box-shadow: 0 0 15px #3b82f6; }
        .btn { padding: 16px; border-radius: 14px; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; text-transform: uppercase; font-size: 0.85rem; }
        .btn:active { transform: scale(0.95); opacity: 0.8; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-sm bg-zinc-900 p-8 rounded-[2.5rem] border border-zinc-800 shadow-2xl">
        <div class="flex justify-between items-center mb-8">
            <h1 class="font-black text-2xl tracking-tighter italic text-zinc-100">ÄIKE <span class="text-red-600">T</span></h1>
            <span class="text-[10px] bg-zinc-800 px-2 py-1 rounded text-zinc-500 font-mono">V25.0</span>
        </div>
        
        <div class="flex justify-around mb-8 glass p-6 rounded-3xl">
            <div class="flex flex-col items-center gap-2">
                <div id="ledPower" class="led led-green"></div>
                <span class="text-[9px] uppercase tracking-widest text-zinc-500">Power</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <div id="ledLock" class="led led-red active"></div>
                <span class="text-[9px] uppercase tracking-widest text-zinc-500">Locked</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <div id="ledEco" class="led led-blue"></div>
                <span class="text-[9px] uppercase tracking-widest text-zinc-500">Eco</span>
            </div>
        </div>

        <div class="flex flex-col gap-3">
            <button id="btnConnect" class="btn bg-white text-black mb-4">Initialisiere Bluetooth</button>
            
            <div class="grid grid-cols-2 gap-3">
                <button onclick="execute(0x01)" class="btn bg-green-600/10 text-green-500 border border-green-500/20">Start</button>
                <button onclick="execute(0x02)" class="btn bg-red-600/10 text-red-500 border border-red-500/20">Stop</button>
            </div>
            
            <button onclick="execute(0x03)" class="btn bg-blue-600/10 text-blue-400 border border-blue-500/20">Eco Modus</button>

            <div class="grid grid-cols-2 gap-3 mt-2">
                <button onclick="execute(0x04)" class="btn bg-zinc-800 text-yellow-500 border border-yellow-500/20">Normal</button>
                <button onclick="execute(0x05)" class="btn bg-zinc-800 text-orange-600 border border-orange-500/20">Sport</button>
            </div>
        </div>

        <p id="statusMsg" class="text-center text-[10px] text-zinc-500 mt-8 uppercase tracking-widest leading-relaxed">Bereit zum Koppeln</p>
    </div>

    <script>
        // PASSWORT-SCHUTZ (Optional: Einfach die Kommentare entfernen)
        /*
        const pin = prompt("Bitte PIN eingeben:");
        if (pin !== "1234") { 
            document.body.innerHTML = "<h1 style='color:white;text-align:center;margin-top:50px;'>Zugriff verweigert</h1>";
        }
        */

        let cmdChar = null;
        let isEco = false;

        // AUTH UUIDs
        const AUTH_SVC = "00002554-1212-efde-1523-785feabcd123";
        const CHAL_CHAR = "00002556-1212-efde-1523-785feabcd123";
        const RESP_CHAR = "00002557-1212-efde-1523-785feabcd123";
        
        // CMD UUIDs
        const CMD_SVC = "00001554-1212-efde-1523-785feabcd123";
        const NOTIFY_CHAR = "0000155e-1212-efde-1523-785feabcd123";
        const WRITE_CHAR = "0000155f-1212-efde-1523-785feabcd123";

        async function execute(cmdId) {
            if(!cmdChar) {
                alert("Bitte zuerst Bluetooth initialisieren!");
                return;
            }

            // Das Äike 10-Byte Protokoll
            const p = new Uint8Array([0x00, 0xD4, 0x00, cmdId, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]);
            
            try {
                await cmdChar.writeValueWithResponse(p);
                updateUI(cmdId);
            } catch(e) { 
                console.error(e);
                document.getElementById('statusMsg').innerText = "Sende-Fehler"; 
            }
        }

        function updateUI(cmdId) {
            const pwr = document.getElementById('ledPower');
            const lck = document.getElementById('ledLock');
            const eco = document.getElementById('ledEco');
            const msg = document.getElementById('statusMsg');

            switch(cmdId) {
                case 0x01: 
                    pwr.classList.add('active'); 
                    lck.classList.remove('active'); 
                    msg.innerText = "System Aktiv / Unlock"; 
                    break;
                case 0x02: 
                    pwr.classList.remove('active'); 
                    lck.classList.add('active'); 
                    msg.innerText = "System Gesperrt"; 
                    break;
                case 0x03: 
                    isEco = !isEco;
                    isEco ? eco.classList.add('active') : eco.classList.remove('active');
                    msg.innerText = isEco ? "Eco Modus Aktiv" : "Standard Modus";
                    break;
                case 0x04:
                    msg.innerText = "Modus: Normal (Limit aufgehoben?)";
                    break;
                case 0x05:
                    msg.innerText = "Modus: SPORT / MAXIMUM";
                    break;
            }
        }

        document.getElementById('btnConnect').onclick = async () => {
            try {
                document.getElementById('statusMsg').innerText = "Suche Äike...";
                
                const dev = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'Aike' }, { namePrefix: 'AIKE' }],
                    optionalServices: [AUTH_SVC, CMD_SVC]
                });

                const server = await dev.gatt.connect();
                
                // --- AUTHENTIFIZIERUNG ---
                const authSvc = await server.getPrimaryService(AUTH_SVC);
                const chalChar = await authSvc.getCharacteristic(CHAL_CHAR);
                const challenge = new Uint8Array((await chalChar.readValue()).buffer);

                // SHA-1(Challenge + 20x 0xFF)
                const suffix = new Uint8Array(20).fill(0xFF);
                const combined = new Uint8Array([...challenge, ...suffix]);
                const hashBuffer = await crypto.subtle.digest('SHA-1', combined);
                const hash = new Uint8Array(hashBuffer);

                const respChar = await authSvc.getCharacteristic(RESP_CHAR);
                await respChar.writeValueWithResponse(hash);

                // --- COMMAND KANAL ---
                const cmdSvc = await server.getPrimaryService(CMD_SVC);
                cmdChar = await cmdSvc.getCharacteristic(WRITE_CHAR);
                
                // Notifications für Feedback (optional)
                const nChar = await cmdSvc.getCharacteristic(NOTIFY_CHAR);
                await nChar.startNotifications();

                document.getElementById('statusMsg').innerText = "Verbunden & Bereit";
                document.getElementById('btnConnect').innerText = "✓ Online";
                document.getElementById('btnConnect').classList.add('opacity-40', 'pointer-events-none');
                
            } catch (e) { 
                document.getElementById('statusMsg').innerText = "Fehler: " + e.message; 
                console.error(e);
            }
        };
    </script>
</body>
</html>
